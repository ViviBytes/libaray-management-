<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="google-site-verification" content="SKjFO_TGyvNFwUjETlv5nmL_Ca4eGyx35umkx-GTCFI" />

    <title>Library Management</title>

  <style>
    :root {
      --primary: #1752ff;
      --secondary: #0f172a;
      --bg: #eef3ff;
      --card: #ffffff;
      --text: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #dbe7ff 0, var(--bg) 45%, #f8fbff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .hero {
      width: min(980px, 100%);
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.15);
      overflow: hidden;
    }
    .hero-top {
      background: linear-gradient(120deg, var(--secondary), var(--primary));
      color: white;
      padding: 34px 28px;
    }
    .hero-top h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }
    .hero-top p {
      margin: 0;
      opacity: 0.92;
    }
    .options {
      padding: 28px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .option {
      border: 1px solid #d8def3;
      border-radius: 14px;
      padding: 20px;
      background: #f9fbff;
    }
    .option h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }
    .option p {
      margin: 0 0 18px;
      color: #4b5563;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-outline {
      border: 1px solid var(--primary);
      color: var(--primary);
      background: #fff;
    }
    @media (max-width: 760px) {
      .options { grid-template-columns: 1fr; }
      .hero-top h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-top">
      <h1>Library Management System</h1>
      <p>Welcome! Start by choosing one option below.</p>
    </div>

    <div class="options">
      <article class="option">
        <h2>New User?</h2>
        <p>If you are visiting for the first time, create your account first.</p>
        <a class="btn btn-primary" href="/signup">Register First</a>
      </article>

      <article class="option">
        <h2>Already Registered?</h2>
        <p>If you already have an ID and password, go directly to login.</p>
        <a class="btn btn-outline" href="/login">Login With ID</a>
      </article>
    </div>
  </section>
</body>
</html>
