<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="SKjFO_TGyvNFwUjETlv5nmL_Ca4eGyx35umkx-GTCFI" />
    <title>Library Management</title>

  <style>
    :root {
      --primary: #1752ff;
      --secondary: #0f172a;
      --tertiary: #0ea5e9;
      --bg: #eef3ff;
      --card: #ffffff;
      --text: #111827;
      --muted: #475569;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 28%),
                  radial-gradient(circle at left bottom, rgba(16, 185, 129, 0.16), transparent 28%),
                  linear-gradient(180deg, #eef3ff 0%, #f8fbff 45%, #ffffff 100%);
    }
    .page-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px 24px 80px;
      position: relative;
    }
    .hero {
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.12);
    }
    .hero-top {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 0;
      padding: 40px;
      align-items: center;
      position: relative;
    }
    .hero-top::before,
    .hero-top::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(32px);
      opacity: 0.45;
    }
    .hero-top::before {
      width: 220px;
      height: 220px;
      top: -40px;
      right: 8%;
      background: rgba(59, 130, 246, 0.18);
    }
    .hero-top::after {
      width: 280px;
      height: 280px;
      bottom: -48px;
      left: 6%;
      background: rgba(16, 185, 129, 0.14);
    }
    .hero-copy {
      max-width: 520px;
    }
    .hero-copy h1 {
      margin: 0 0 14px;
      font-size: clamp(2.5rem, 4vw, 4rem);
      line-height: 1.02;
      animation: fadeInUp 1s ease both;
    }
    .hero-copy p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
      animation: fadeInUp 1.1s ease both;
      animation-delay: 0.15s;
    }
    .hero-copy .hero-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .hero-copy .btn {
      min-width: 170px;
      text-align: center;
    }
    .hero-visual {
      display: grid;
      place-items: center;
      padding-top: 10px;
    }
    .dance-stage {
      width: 360px;
      height: 380px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .dance-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 35%),
                  radial-gradient(circle at bottom, rgba(59, 130, 246, 0.14), transparent 30%);
      pointer-events: none;
    }
    .dance-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 68%;
      height: 18%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.16), transparent 55%);
      transform: translateX(-50%);
      filter: blur(10px);
      pointer-events: none;
    }
    .dance-stage .streak {
      position: absolute;
      width: 220px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0));
      filter: blur(1px);
      opacity: 0.8;
      animation: streakSlide 6s linear infinite;
      pointer-events: none;
      --streak-rotate: 12deg;
    }
    .dance-stage .streak:nth-child(1) {
      top: 40px;
      left: -280px;
      animation-delay: 0s;
      --streak-rotate: 12deg;
    }
    .dance-stage .streak:nth-child(2) {
      top: 92px;
      left: -260px;
      animation-delay: 1.2s;
      --streak-rotate: -10deg;
    }
    .dance-stage .streak:nth-child(3) {
      top: 160px;
      left: -300px;
      animation-delay: 2.4s;
      --streak-rotate: 8deg;
    }
    .dance-stage .floating-book {
      position: absolute;
      width: 44px;
      height: 56px;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      border: 2px solid rgba(37, 99, 235, 0.2);
      border-radius: 10px;
      box-shadow: 0 14px 22px rgba(15, 23, 42, 0.12);
      transform-origin: center;
      animation: floatBook 5.6s ease-in-out infinite;
      z-index: 1;
    }
    .dance-stage .floating-book::before {
      content: "";
      position: absolute;
      inset: 10px 10px auto auto;
      width: 20px;
      height: 6px;
      background: rgba(37, 99, 235, 0.18);
      border-radius: 999px;
    }
    .dance-stage .floating-book:nth-child(4) {
      left: 32px;
      top: 68px;
      animation-delay: 0.1s;
      animation-duration: 5.4s;
    }
    .dance-stage .floating-book:nth-child(5) {
      right: 22px;
      top: 44px;
      animation-delay: 1.1s;
      animation-duration: 6.2s;
      transform: scale(0.92);
    }
    .dance-stage .floating-book:nth-child(6) {
      left: 56px;
      bottom: 88px;
      animation-delay: 2.3s;
      animation-duration: 6.4s;
      transform: scale(0.78);
    }
    .dance-stage .floating-book:nth-child(7) {
      right: 48px;
      bottom: 72px;
      animation-delay: 1.8s;
      animation-duration: 5.8s;
      transform: scale(0.84);
    }
    .dancer {
      position: relative;
      width: 180px;
      height: 290px;
      animation: danceBounce 4.2s ease-in-out infinite;
      z-index: 2;
    }
    .dancer .skirt {
      position: absolute;
      left: 50%;
      bottom: 112px;
      width: 124px;
      height: 88px;
      background: linear-gradient(180deg, #93c5fd 0%, #60a5fa 100%);
      border-radius: 0 0 72px 72px;
      transform: translateX(-50%);
      overflow: hidden;
    }
    .dancer .skirt::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      height: 16px;
      background: rgba(255,255,255,0.24);
      border-radius: 999px;
      transform: skewX(-12deg);
    }
    .dancer .torso {
      position: absolute;
      left: 50%;
      bottom: 170px;
      width: 56px;
      height: 128px;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 32px 32px 18px 18px;
      transform: translateX(-50%);
      animation: torsoSwing 4.2s ease-in-out infinite;
    }
    .dancer .head {
      position: absolute;
      left: 50%;
      bottom: 276px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #fde68a;
      transform: translateX(-50%);
      z-index: 2;
      box-shadow: inset -6px 8px 0 rgba(249, 115, 22, 0.18);
    }
    .dancer .hair {
      position: absolute;
      left: 50%;
      bottom: 296px;
      width: 94px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
      transform: translateX(-50%);
      z-index: 1;
      animation: hairSwing 4.2s ease-in-out infinite;
    }
    .dancer .hair::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 22px;
      width: 70px;
      height: 28px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }
    .dancer .face {
      position: absolute;
      left: 50%;
      bottom: 286px;
      width: 38px;
      height: 26px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(15,23,42,0.12);
      box-shadow: 0 8px 0 rgba(15,23,42,0.08);
    }
    .dancer .arm {
      position: absolute;
      width: 18px;
      height: 96px;
      background: #2563eb;
      border-radius: 24px;
      top: 158px;
      transform-origin: top center;
    }
    .dancer .arm.left {
      left: 8px;
      transform: rotate(-28deg);
      animation: leftArmDance 4.2s ease-in-out infinite;
    }
    .dancer .arm.right {
      right: 8px;
      transform: rotate(34deg);
      animation: rightArmDance 4.2s ease-in-out infinite;
    }
    .dancer .leg {
      position: absolute;
      width: 18px;
      height: 118px;
      background: #1d4ed8;
      border-radius: 22px;
      bottom: 0;
      transform-origin: top center;
    }
    .dancer .leg.left {
      left: 38px;
      animation: leftLegDance 4.2s ease-in-out infinite;
    }
    .dancer .leg.right {
      right: 38px;
      animation: rightLegDance 4.2s ease-in-out infinite;
    }
    .dancer .spark {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #facc15;
      filter: blur(0.5px);
      box-shadow: 0 0 12px rgba(250,204,21,0.46);
      animation: starTwinkle 2.8s ease-in-out infinite;
    }
    .dancer .spark:nth-child(1) { left: 18px; top: 18px; animation-delay: 0.1s; }
    .dancer .spark:nth-child(2) { right: 22px; top: 32px; animation-delay: 0.5s; }
    .dancer .spark:nth-child(3) { left: 24px; bottom: 42px; animation-delay: 1s; }
    .dancer .spark:nth-child(4) { right: 18px; bottom: 62px; animation-delay: 1.4s; }
    .hero-visual p {
      margin: 0;
      color: var(--secondary);
      font-size: 0.98rem;
      max-width: 320px;
      text-align: center;
    }
    @keyframes streakSlide {
      0% { transform: translateX(-100%) rotate(var(--streak-rotate)); opacity: 0; }
      25% { opacity: 0.8; }
      75% { opacity: 0.8; }
      100% { transform: translateX(220%) rotate(var(--streak-rotate)); opacity: 0; }
    }
    @keyframes floatBook {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-12px) rotate(-2deg); }
      40% { transform: translateY(-6px) rotate(2deg); }
      60% { transform: translateY(-10px) rotate(-3deg); }
      80% { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes danceBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-12px); }
    }
    @keyframes torsoSwing {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(2deg); }
      50% { transform: translateX(-50%) rotate(0deg); }
      75% { transform: translateX(-50%) rotate(-2deg); }
    }
    @keyframes hairSwing {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      50% { transform: translateX(-50%) rotate(-4deg); }
    }
    @keyframes leftArmDance {
      0%, 100% { transform: rotate(-28deg); }
      40% { transform: rotate(-12deg); }
      60% { transform: rotate(-32deg); }
    }
    @keyframes rightArmDance {
      0%, 100% { transform: rotate(34deg); }
      40% { transform: rotate(16deg); }
      60% { transform: rotate(38deg); }
    }
    @keyframes leftLegDance {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(8deg); }
      60% { transform: rotate(-6deg); }
    }
    @keyframes rightLegDance {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-10deg); }
      60% { transform: rotate(6deg); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="hero">
      <div class="hero-top">
        <div class="hero-copy">
          <h1>Welcome to the Library</h1>
          <p>Find books, explore collections, and get started — sign up or log in to access your account.</p>
          <div class="hero-links">
            <a class="btn btn-primary" href="/signup">Get Started</a>
            <a class="btn btn-outline" href="/login">Sign In</a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="dance-stage">
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="floating-book"></div>
            <div class="floating-book"></div>
            <div class="floating-book"></div>
            <div class="floating-book"></div>
            <div class="dancer">
              <div class="spark"></div>
              <div class="spark"></div>
              <div class="spark"></div>
              <div class="spark"></div>
              <div class="hair"></div>
              <div class="head"></div>
              <div class="face"></div>
              <div class="torso"></div>
              <div class="arm left"></div>
              <div class="arm right"></div>
              <div class="skirt"></div>
              <div class="leg left"></div>
              <div class="leg right"></div>
            </div>
          </div>
          <p>Animated dance hero with floating books, motion streaks, and layered particles.</p>
        </div>

      </div>
      <!-- hero bottom removed for a cleaner landing page per request -->
    </div>

    <!-- sticky menu removed as requested -->
  </div>

  <!-- Menu toggle script removed (sticky menu removed) -->
</body>
</html>
