<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(160deg, #f0f5ff, #e8f0ff);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .card {
            width: min(420px, 100%);
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 14px 30px rgba(23, 82, 255, 0.15);
        }
        h2 { margin-top: 0; }
        input, button {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid #d5dcf3;
            margin-bottom: 12px;
        }
        button {
            background: #1752ff;
            color: #fff;
            border: 0;
            font-weight: 600;
            cursor: pointer;
        }
        .links { text-align: center; font-size: 14px; }
        .error { color: #b91c1c; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Library Login</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="User ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <a href="/">Home</a> | <a href="/signup">New user? Register</a>
        </div>
    </div>
</body>
</html>
