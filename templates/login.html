<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            color-scheme: only light;
            --bg: #f5f8ff;
            --card: #ffffff;
            --primary: #2749f7;
            --primary-soft: #e5ebff;
            --text: #111827;
            --muted: #475569;
            --border: #d8e0f4;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at top left, rgba(39, 73, 247, 0.12), transparent 32%),
                        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.12), transparent 26%),
                        linear-gradient(180deg, #eef2ff, #f8fafc);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: var(--card);
            border-radius: 28px;
            padding: 34px 28px;
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.14);
            border: 1px solid rgba(99, 102, 241, 0.12);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2749f7, #0ea5e9);
            display: grid;
            place-items: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
        }
        h2 {
            margin: 0;
            font-size: 28px;
        }
        p.subtitle {
            margin: 10px 0 26px;
            color: var(--muted);
            line-height: 1.6;
        }
        input, button {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            font-size: 15px;
            margin-bottom: 14px;
            background: #fff;
        }
        input {
            color: var(--text);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(39, 73, 247, 0.18);
        }
        .links {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
            margin-top: 12px;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #fecaca;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div>
                <h2>Library Login</h2>
                <p class="subtitle">Access your library dashboard, search books, and manage user requests with a fresh signed-in experience.</p>
            </div>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="User ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div class="links">
            <a href="/">Home</a> | <a href="/signup">Create account</a>
        </div>
    </div>
</body>
</html>
