<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(160deg, #eef5ff, #dde9ff);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(430px, 100%);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 14px 30px rgba(20, 40, 120, 0.15);
      padding: 24px;
    }
    h2 { margin-top: 0; }
    input, button {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #d5dcf3;
      margin-bottom: 12px;
    }
    button {
      border: 0;
      background: #1f56ff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .error { color: #b91c1c; margin-bottom: 10px; }
    .links { text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create New Account</h2>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input name="username" placeholder="Choose User ID" required>
      <input type="email" name="email" placeholder="Email ID" required>
      <input type="password" name="password" placeholder="Create Password" required>
      <button type="submit">Register</button>
    </form>
    <div class="links">
      <a href="/">Home</a> | <a href="/login">Already registered? Login</a>
    </div>
  </div>
</body>
</html>
